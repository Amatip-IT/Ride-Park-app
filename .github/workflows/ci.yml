name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed live Stripe server keys
        shell: bash
        run: |
          if git grep -nE '(rk_live|sk_live)_[[:alnum:]]{20,}'; then
            echo 'A live Stripe server key was found in the repository. Rotate it and remove it from Git history.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand --silent --detectOpenHandles
      - run: npm run test:e2e -- --runInBand --detectOpenHandles

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
